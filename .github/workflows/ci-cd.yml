name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    name: Build · Test · Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          MONGO_URI: ${{ secrets.MONGOURI }}
          MONGO_DB_NAME: ${{ secrets.MONGODB_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-task-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-task-manager:${{ github.sha }}

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 \
            -e MONGO_URI="${{ secrets.MONGOURI }}" \
            -e MONGO_DB_NAME="${{ secrets.MONGODB_NAME }}" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --name test-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-task-manager:latest

          sleep 8
          curl --fail http://localhost:5000/health || (docker logs test-container && exit 1)

          docker stop test-container
          docker rm test-container

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-task-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-task-manager:${{ github.sha }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-test-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_URL }}"