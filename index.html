<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>Smart Task Manager</h2>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Tasks</a>
        <a href="#" class="nav-item">Projects</a>
        <a href="#" class="nav-item">Reminders</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Dashboard Overview</h1>
          <p>Track your tasks and progress in one place.</p>
        </div>
      </header>

      <section class="dashboard-cards">
        <div class="dashboard-card">
          <h3>Total Tasks</h3>
          <p class="card-number">12</p>
        </div>

        <div class="dashboard-card">
          <h3>Completed Tasks</h3>
          <p class="card-number">5</p>
        </div>

        <div class="dashboard-card">
          <h3>Pending Tasks</h3>
          <p class="card-number">7</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
