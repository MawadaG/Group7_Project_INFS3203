<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>Smart Task Manager</h2>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Tasks</a>
        <a href="#" class="nav-item">Projects</a>
        <a href="#" class="nav-item">Reminders</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Dashboard Overview</h1>
          <p>Track your tasks and progress in one place.</p>
        </div>
      </header>

      <section class="dashboard-cards">
        <div class="dashboard-card">
          <h3>Total Tasks</h3>
          <p class="card-number" id="totalTasks">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Completed Tasks</h3>
          <p class="card-number" id="completedTasks">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Pending Tasks</h3>
          <p class="card-number" id="pendingTasks">0</p>
        </div>
      </section>

      <section class="form-section">
        <div class="section-header">
          <h2>Add New Task</h2>
        </div>

        <p id="formMessage" class="form-message"></p>

        <form id="taskForm" class="task-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="title">Task Title *</label>
              <input type="text" id="title" name="title" placeholder="Enter task title" required />
            </div>

            <div class="form-group">
              <label for="due_date">Due Date</label>
              <input type="date" id="due_date" name="due_date" />
            </div>

            <div class="form-group">
              <label for="priority">Priority</label>
              <select id="priority" name="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="in-progress">In Progress</option>
              </select>
            </div>

            <div class="form-group form-group-full">
              <label for="project_id">Project ID (Optional)</label>
              <input type="text" id="project_id" name="project_id" placeholder="Enter project ID" />
            </div>

            <div class="form-group form-group-full">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="4" placeholder="Enter task description"></textarea>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Create Task</button>
        </form>
      </section>

      <section class="task-list-section">
        <div class="section-header">
          <h2>Task List</h2>
          <button id="refreshBtn" class="refresh-btn">Refresh</button>
        </div>

        <p id="taskMessage" class="task-message">Loading tasks...</p>
        <div id="taskList" class="task-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
